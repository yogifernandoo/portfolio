<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0f1e" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Space Portal -->
  <rect width="400" height="400" rx="36" fill="url(#spaceGlow)"/>
  
  <!-- Subtle Orbital Rings in Background -->
  <ellipse cx="200" cy="200" rx="160" ry="80" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-dasharray="4 8" transform="rotate(-25 200 200)"/>
  <ellipse cx="200" cy="200" rx="140" ry="120" fill="none" stroke="#a855f7" stroke-opacity="0.15" stroke-dasharray="6 6"/>

  <!-- Tiny Stars -->
  <circle cx="80" cy="90" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="320" cy="70" r="2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="70" cy="280" r="1.5" fill="#818cf8" opacity="0.6"/>
  <circle cx="340" cy="300" r="2.5" fill="#f43f5e" opacity="0.7"/>

  <!-- Developer/Cosmonaut Body & Hoodie -->
  <path d="M 100 380 C 100 310, 140 270, 200 270 C 260 270, 300 310, 300 380 Z" fill="url(#suitGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Chest Neon Circuit Accents -->
  <path d="M 170 320 L 190 350 L 210 350 L 230 320" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="200" cy="330" r="4" fill="#38bdf8" filter="url(#softGlow)"/>

  <!-- Head / Helmet Silhouette -->
  <ellipse cx="200" cy="180" rx="72" ry="80" fill="#0f172a" stroke="url(#neonCyan)" stroke-width="3"/>

  <!-- Cosmic Visor / Developer Glasses with Reflection -->
  <rect x="145" y="145" width="110" height="48" rx="20" fill="url(#visorGrad)" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Digital Code Matrix Reflection inside Visor -->
  <path d="M 160 160 L 175 160 M 160 170 L 190 170 M 160 180 L 170 180" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <path d="M 210 160 L 240 160 M 215 170 L 235 170" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <polygon points="155,148 200,148 185,190 145,190" fill="#ffffff" opacity="0.12"/>

  <!-- Subtle Rim Light & Headphones -->
  <rect x="122" y="155" width="12" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="266" y="155" width="12" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 128 155 C 128 110, 272 110, 272 155" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Glow Halo Ring above -->
  <ellipse cx="200" cy="96" rx="42" ry="12" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#softGlow)" opacity="0.8"/>
  <ellipse cx="200" cy="96" rx="42" ry="12" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
</svg>
