<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="nebulaDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0c1024"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Browser Container -->
  <rect x="0" y="0" width="1200" height="750" rx="18" fill="url(#nebulaDark)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="48" rx="18" fill="#0b0f1e"/>
  <rect x="0" y="30" width="1200" height="18" fill="#0b0f1e"/>
  <circle cx="28" cy="24" r="6.5" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6.5" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6.5" fill="#10b981"/>
  <rect x="110" y="11" width="550" height="26" rx="6" fill="#151d33" stroke="#253252" stroke-width="1"/>
  <text x="130" y="28" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12">https://nebulaops.cloud/cluster/asia-southeast-nodes</text>

  <!-- Navigation -->
  <rect x="0" y="48" width="1200" height="52" fill="#0c1122" stroke="#1c253d" stroke-width="1"/>
  <circle cx="45" cy="74" r="12" fill="url(#purpleGlow)"/>
  <text x="68" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">NebulaOps</text>
  <rect x="190" y="60" width="90" height="28" rx="6" fill="#202945"/>
  <text x="205" y="79" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Clusters</text>
  <text x="310" y="79" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Telemetry</text>
  <text x="400" y="79" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Deployments</text>
  <text x="515" y="79" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Security</text>
  <rect x="1040" y="60" width="120" height="30" rx="6" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
  <text x="1055" y="80" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Live Pulse ●</text>

  <!-- Topology Node Map Header -->
  <text x="40" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Cluster Node Distribution &amp; Gateway Health</text>
  <text x="40" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Auto-scaling group active across 3 edge availability zones</text>

  <!-- Big Interactive Canvas Area -->
  <rect x="40" y="190" width="760" height="330" rx="14" fill="#080c1a" stroke="#1d2744" stroke-width="1"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="40" y1="270" x2="800" y2="270" stroke="#151e36" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="350" x2="800" y2="350" stroke="#151e36" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="430" x2="800" y2="430" stroke="#151e36" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Network Interconnect Nodes -->
  <!-- Central Edge Gateway -->
  <circle cx="420" cy="350" r="32" fill="#1b2545" stroke="#a855f7" stroke-width="3"/>
  <circle cx="420" cy="350" r="14" fill="#c084fc"/>
  <text x="420" y="400" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Gateway Edge-01</text>
  <text x="420" y="415" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">99.99% Uptime</text>

  <!-- Node 1 -->
  <line x1="420" y1="350" x2="180" y2="270" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="180" cy="270" r="22" fill="#151f3b" stroke="#38bdf8" stroke-width="2"/>
  <text x="180" y="310" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Worker-Node-A</text>
  <text x="180" y="325" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Load: 34% • 12 Pods</text>

  <!-- Node 2 -->
  <line x1="420" y1="350" x2="640" y2="260" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="640" cy="260" r="22" fill="#151f3b" stroke="#38bdf8" stroke-width="2"/>
  <text x="640" y="300" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Worker-Node-B</text>
  <text x="640" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Load: 48% • 16 Pods</text>

  <!-- Node 3 -->
  <line x1="420" y1="350" x2="260" y2="440" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="260" cy="440" r="22" fill="#151f3b" stroke="#10b981" stroke-width="2"/>
  <text x="260" y="480" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Cache-Cluster (Redis)</text>

  <!-- Node 4 -->
  <line x1="420" y1="350" x2="580" y2="440" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="580" cy="440" r="22" fill="#151f3b" stroke="#fbbf24" stroke-width="2"/>
  <text x="580" y="480" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Postgres Primary</text>

  <!-- Right Side Telemetry Feed -->
  <rect x="830" y="190" width="330" height="520" rx="14" fill="#080c1a" stroke="#1d2744" stroke-width="1"/>
  <text x="855" y="225" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">⚡ Live Incident &amp; Log Stream</text>
  
  <rect x="850" y="250" width="290" height="70" rx="8" fill="#131b31" stroke="#222f52" stroke-width="1"/>
  <text x="865" y="275" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">[200 OK] /api/v2/telemetry</text>
  <text x="865" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Handled in 4.2ms • Edge ID: SGP-01</text>

  <rect x="850" y="335" width="290" height="70" rx="8" fill="#131b31" stroke="#222f52" stroke-width="1"/>
  <text x="865" y="360" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">[AUTO-HEAL] Rebalanced pod-94</text>
  <text x="865" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Zero downtime transition succeeded</text>

  <rect x="850" y="420" width="290" height="70" rx="8" fill="#131b31" stroke="#222f52" stroke-width="1"/>
  <text x="865" y="445" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">[DEPLOY] commit e7f2a1 deployed</text>
  <text x="865" y="465" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Pipeline duration: 42s • Verified</text>

  <rect x="850" y="505" width="290" height="70" rx="8" fill="#131b31" stroke="#222f52" stroke-width="1"/>
  <text x="865" y="530" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">[SECURITY] SSL Handshake Valid</text>
  <text x="865" y="550" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">TLS 1.3 / HTTP/3 Quic enabled</text>

  <!-- Lower Left Metric Cards -->
  <rect x="40" y="540" width="235" height="170" rx="12" fill="#0d1428" stroke="#1d2744" stroke-width="1"/>
  <text x="60" y="575" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Throughput (Req/Sec)</text>
  <text x="60" y="615" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="700">48,210</text>
  <text x="60" y="645" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">Peak load handled smoothly</text>

  <rect x="300" y="540" width="235" height="170" rx="12" fill="#0d1428" stroke="#1d2744" stroke-width="1"/>
  <text x="320" y="575" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Memory Utilization</text>
  <text x="320" y="615" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="700">38.4%</text>
  <text x="320" y="645" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">Optimized garbage collection</text>

  <rect x="560" y="540" width="240" height="170" rx="12" fill="#0d1428" stroke="#1d2744" stroke-width="1"/>
  <text x="580" y="575" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Avg Query Duration</text>
  <text x="580" y="615" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="700">2.1 ms</text>
  <text x="580" y="645" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12">Indexed B-Tree performance</text>
</svg>
