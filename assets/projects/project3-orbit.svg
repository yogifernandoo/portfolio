<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="cosmosBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141a36"/>
      <stop offset="60%" stop-color="#070914"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>
    <radialGradient id="planetGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="750" rx="18" fill="url(#cosmosBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Browser Header -->
  <rect x="0" y="0" width="1200" height="48" rx="18" fill="#0b0f1e"/>
  <rect x="0" y="30" width="1200" height="18" fill="#0b0f1e"/>
  <circle cx="28" cy="24" r="6.5" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6.5" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6.5" fill="#10b981"/>
  <rect x="110" y="11" width="550" height="26" rx="6" fill="#151d33" stroke="#253252" stroke-width="1"/>
  <text x="130" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">https://astronova-explorer.space/exoplanets/kepler-452b</text>

  <!-- Navbar -->
  <rect x="0" y="48" width="1200" height="56" fill="#0c1122" fill-opacity="0.9" stroke="#1c253d" stroke-width="1"/>
  <circle cx="50" cy="76" r="14" fill="#38bdf8"/>
  <ellipse cx="50" cy="76" rx="20" ry="7" fill="none" stroke="#f8fafc" stroke-width="1.5" transform="rotate(-20 50 76)"/>
  <text x="80" y="82" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">AstroNova Explorer</text>
  <text x="320" y="81" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Deep Space Catalog</text>
  <text x="490" y="81" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Orbital Physics Engine</text>
  <text x="680" y="81" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Observatory Streams</text>
  <rect x="1030" y="61" width="130" height="32" rx="8" fill="#0284c7"/>
  <text x="1052" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Simulate Warp 🚀</text>

  <!-- 3D Planet Showcase Area -->
  <g transform="translate(380, 390)">
    <!-- Starfield particles behind planet -->
    <circle cx="-250" cy="-140" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="280" cy="-160" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="-180" cy="180" r="1" fill="#f8fafc" opacity="0.7"/>
    <circle cx="340" cy="120" r="2.5" fill="#c084fc" opacity="0.7"/>

    <!-- Orbital Ring System -->
    <ellipse cx="0" cy="0" rx="270" ry="85" fill="none" stroke="url(#ringGrad)" stroke-width="14" transform="rotate(-18 0 0)" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="300" ry="95" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 6" transform="rotate(-18 0 0)" opacity="0.4"/>

    <!-- Planet Sphere -->
    <circle cx="0" cy="0" r="140" fill="url(#planetGlow)"/>
    <!-- Atmosphere haze -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#67e8f9" stroke-width="4" opacity="0.6"/>

    <!-- Atmospheric surface bands -->
    <path d="M -120 -40 Q 0 -20, 130 -30" fill="none" stroke="#38bdf8" stroke-width="18" opacity="0.25"/>
    <path d="M -135 20 Q -20 40, 125 15" fill="none" stroke="#0ea5e9" stroke-width="24" opacity="0.3"/>
    <path d="M -110 70 Q 20 80, 105 60" fill="none" stroke="#0369a1" stroke-width="14" opacity="0.4"/>

    <!-- Front Ring Cross -->
    <path d="M -260 80 Q 0 0, 260 -80" fill="none" stroke="#67e8f9" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- Left Telemetry Panel -->
  <rect x="40" y="140" width="310" height="560" rx="14" fill="#0a0e1c" fill-opacity="0.85" stroke="#1c253d" stroke-width="1"/>
  <text x="65" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TARGET DESIGNATION</text>
  <text x="65" y="210" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Kepler-452b</text>
  <text x="65" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">"Earth's Older Cousin" • Habitable Zone</text>

  <line x1="65" y1="260" x2="320" y2="260" stroke="#1e293b" stroke-width="1"/>

  <text x="65" y="290" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Distance from Sol</text>
  <text x="65" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">1,402 Light-Years</text>

  <text x="65" y="355" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Orbital Period (Year)</text>
  <text x="65" y="380" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">384.8 Earth Days</text>

  <text x="65" y="420" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Surface Gravity</text>
  <text x="65" y="445" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">~1.9g (Super-Earth)</text>

  <text x="65" y="485" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Atmosphere Biosignature</text>
  <rect x="65" y="500" width="260" height="24" rx="6" fill="#1e293b"/>
  <rect x="65" y="500" width="185" height="24" rx="6" fill="#0284c7"/>
  <text x="75" y="517" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Nitrogen / Water Vapor 71%</text>

  <rect x="65" y="560" width="260" height="110" rx="10" fill="#131d36" stroke="#25355e" stroke-width="1"/>
  <text x="80" y="590" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">WebGL Orbit Simulation</text>
  <text x="80" y="615" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">60 FPS 3D canvas physics</text>
  <text x="80" y="635" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Three.js + GLSL custom shader</text>
  <text x="80" y="655" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">✓ Zero latency interactive</text>

  <!-- Right Side Control HUD -->
  <rect x="850" y="140" width="310" height="560" rx="14" fill="#0a0e1c" fill-opacity="0.85" stroke="#1c253d" stroke-width="1"/>
  <text x="875" y="175" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MISSION TELEMETRY DATA</text>
  <text x="875" y="210" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Kepler Space Sensor</text>

  <rect x="875" y="240" width="260" height="85" rx="8" fill="#131c36" stroke="#23325c" stroke-width="1"/>
  <text x="890" y="268" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Spectrometer Sensor Flux</text>
  <path d="M 890 300 Q 940 280, 970 310 T 1040 285 T 1110 300" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <rect x="875" y="345" width="260" height="85" rx="8" fill="#131c36" stroke="#23325c" stroke-width="1"/>
  <text x="890" y="373" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Radio Wave Transmission</text>
  <path d="M 890 405 Q 920 385, 950 415 T 1000 385 T 1050 415 T 1110 395" fill="none" stroke="#a855f7" stroke-width="2.5"/>

  <rect x="875" y="450" width="260" height="85" rx="8" fill="#131c36" stroke="#23325c" stroke-width="1"/>
  <text x="890" y="478" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Magnetic Field Flux</text>
  <path d="M 890 510 L 930 495 L 970 515 L 1020 490 L 1070 520 L 1110 500" fill="none" stroke="#34d399" stroke-width="2.5"/>

  <rect x="875" y="565" width="260" height="48" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="920" y="595" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🔭 Calibrate Telescope</text>
</svg>
