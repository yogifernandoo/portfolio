  <text x="75" y="205" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Diskon Aksesoris 40%</text>
  <rect x="75" y="225" width="110" height="32" rx="8" fill="url(#btnGrad)"/>
  <text x="95" y="246" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Belanja Cepat</text>

  <!-- Product Grid Mobile -->
