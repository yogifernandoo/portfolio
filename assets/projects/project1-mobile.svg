  <text x="70" y="435" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Keychron K2 Pro</text>
  <text x="70" y="455" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Rp 1.499.000</text>
  <rect x="70" y="470" width="155" height="28" rx="6" fill="#0284c7"/>
  <text x="120" y="488" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+ Keranjang</text>

  <rect x="260" y="300" width="185" height="210" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="275" y="315" width="155" height="100" rx="8" fill="#1e293b" opacity="0.6"/>
  <text x="275" y="435" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Logitech MX Master</text>
  <text x="275" y="455" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Rp 1.250.000</text>
  <rect x="275" y="470" width="155" height="28" rx="6" fill="#0284c7"/>
  <text x="325" y="488" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+ Keranjang</text>

  <!-- Mobile Bottom Nav -->
  <rect x="55" y="690" width="390" height="58" rx="20" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <text x="95" y="725" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Beranda</text>
  <text x="195" y="725" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Kategori</text>
  <text x="290" y="725" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Favorit</text>
  <text x="380" y="725" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Profil</text>
