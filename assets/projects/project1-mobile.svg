<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Phone Frame -->
  <rect x="20" y="20" width="460" height="760" rx="44" fill="#090d16" stroke="#334155" stroke-width="4"/>
  <rect x="30" y="30" width="440" height="740" rx="36" fill="url(#phoneBg)"/>

  <!-- Dynamic Island / Notch -->
  <rect x="180" y="42" width="140" height="24" rx="12" fill="#020617"/>
  <circle cx="295" cy="54" r="5" fill="#1e293b"/>

  <!-- Mobile Header -->
  <text x="60" y="105" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">ApexStore Mobile</text>
  <circle cx="420" cy="100" r="16" fill="#1e293b"/>
  <text x="414" y="105" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14">🛍️</text>

