<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="fintechDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cardEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="750" rx="18" fill="url(#fintechDark)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Browser Title Bar -->
  <rect x="0" y="0" width="1200" height="48" rx="18" fill="#0b0f1e"/>
  <rect x="0" y="30" width="1200" height="18" fill="#0b0f1e"/>
  <circle cx="28" cy="24" r="6.5" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6.5" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6.5" fill="#10b981"/>
  <rect x="110" y="11" width="550" height="26" rx="6" fill="#151d33" stroke="#253252" stroke-width="1"/>
  <text x="130" y="28" fill="#10b981" font-family="system-ui, sans-serif" font-size="12">https://luminapay.finance/wallet/treasury</text>

  <!-- Navigation -->
  <rect x="0" y="48" width="1200" height="56" fill="#0d1322" stroke="#1c253d" stroke-width="1"/>
  <rect x="35" y="60" width="32" height="32" rx="8" fill="url(#cyanGrad)"/>
  <text x="78" y="82" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">LuminaPay</text>
  <text x="240" y="82" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Treasury</text>
  <text x="340" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Invoices</text>
  <text x="430" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">FX Swap</text>
  <text x="520" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Developers API</text>
  
  <rect x="1020" y="60" width="145" height="34" rx="8" fill="#10b981"/>
  <text x="1045" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">+ Kirim Dana</text>

  <!-- Left Main Column -->
  <!-- Digital Virtual Card -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="380" height="230" rx="18" fill="url(#cardEmerald)" stroke="#34d399" stroke-width="1"/>
    <!-- Card Chip -->
    <rect x="35" y="35" width="46" height="34" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <!-- Contactless wave -->
    <path d="M 95 44 A 8 8 0 0 1 95 60 M 102 38 A 15 15 0 0 1 102 66" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <!-- Card Number -->
    <text x="35" y="130" fill="#ffffff" font-family="monospace" font-size="20" letter-spacing="4">5412  ••••  ••••  9821</text>
    <!-- Card Holder -->
    <text x="35" y="180" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">CARDHOLDER</text>
    <text x="35" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">YOGI FERNANDO</text>
    <text x="280" y="180" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">EXPIRES</text>
    <text x="280" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">09/29</text>
  </g>

  <!-- Quick Balance HUD -->
  <g transform="translate(480, 130)">
    <rect x="0" y="0" width="660" height="230" rx="18" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="45" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Available Liquid Balance</text>
    <text x="35" y="90" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="700">Rp 582.490.000</text>
    <text x="35" y="120" fill="#10b981" font-family="system-ui, sans-serif" font-size="13">↑ +18.4% pendapatan bersih vs bulan lalu</text>

    <!-- Mini Metrics -->
    <line x1="35" y1="145" x2="620" y2="145" stroke="#1e293b" stroke-width="1"/>

    <text x="35" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Pemasukan (Sept)</text>
    <text x="35" y="202" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Rp 124.8M</text>

    <text x="240" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Pengeluaran Operasional</text>
    <text x="240" y="202" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Rp 31.2M</text>

    <text x="450" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Integrasi Gateway</text>
    <text x="450" y="202" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Midtrans &amp; Xendit</text>
  </g>

  <!-- Bottom Section: Recent Transactions Table -->
  <g transform="translate(60, 390)">
    <rect x="0" y="0" width="1080" height="310" rx="16" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Riwayat Transaksi Real-Time</text>
    <text x="960" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">Export CSV ↓</text>

    <!-- Row 1 -->
    <line x1="35" y1="65" x2="1045" y2="65" stroke="#1e293b" stroke-width="1"/>
    <circle cx="55" cy="100" r="16" fill="#10b981" fill-opacity="0.2"/>
    <text x="50" y="105" fill="#10b981" font-family="system-ui, sans-serif" font-size="14">↓</text>
    <text x="90" y="98" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Payout Klien: PT Nusantara Digital</text>
    <text x="90" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Inv #INV-2026-081 • Bank BCA Virtual Account</text>
    <text x="820" y="106" fill="#10b981" font-family="system-ui, sans-serif" font-size="15" font-weight="700">+ Rp 45.000.000</text>
    <rect x="975" y="90" width="70" height="24" rx="6" fill="#10b981" fill-opacity="0.15"/>
    <text x="987" y="106" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">BERHASIL</text>

    <!-- Row 2 -->
    <line x1="35" y1="135" x2="1045" y2="135" stroke="#1e293b" stroke-width="1"/>
    <circle cx="55" cy="170" r="16" fill="#ef4444" fill-opacity="0.2"/>
    <text x="50" y="175" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14">↑</text>
    <text x="90" y="168" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">AWS Cloud Infrastructure &amp; Edge Server</text>
    <text x="90" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Automated Recurring Billing • Cloud Hosting</text>
    <text x="820" y="176" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">- Rp 2.450.000</text>
    <rect x="975" y="160" width="70" height="24" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="990" y="176" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SELESAI</text>

    <!-- Row 3 -->
    <line x1="35" y1="205" x2="1045" y2="205" stroke="#1e293b" stroke-width="1"/>
    <circle cx="55" cy="240" r="16" fill="#10b981" fill-opacity="0.2"/>
    <text x="50" y="245" fill="#10b981" font-family="system-ui, sans-serif" font-size="14">↓</text>
    <text x="90" y="238" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Royalti Lisensi Software SaaS</text>
    <text x="90" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Stripe Connect Global Settlement</text>
    <text x="820" y="246" fill="#10b981" font-family="system-ui, sans-serif" font-size="15" font-weight="700">+ Rp 18.750.000</text>
    <rect x="975" y="230" width="70" height="24" rx="6" fill="#10b981" fill-opacity="0.15"/>
    <text x="987" y="246" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">BERHASIL</text>
  </g>
</svg>
