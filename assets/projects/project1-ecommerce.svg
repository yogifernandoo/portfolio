  <text x="948" y="386" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Mechanical Keyb V2</text>
  <text x="948" y="402" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">512 terjual • Rp 890rb</text>

  <rect x="900" y="425" width="230" height="52" rx="8" fill="#1e293b" opacity="0.6"/>
  <rect x="910" y="437" width="28" height="28" rx="6" fill="#a855f7" opacity="0.4"/>
  <text x="948" y="451" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Wireless Noise Headset</text>
  <text x="948" y="467" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">380 terjual • Rp 1.4Jt</text>

  <rect x="900" y="490" width="230" height="52" rx="8" fill="#1e293b" opacity="0.6"/>
  <rect x="910" y="502" width="28" height="28" rx="6" fill="#10b981" opacity="0.4"/>
  <text x="948" y="516" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ergonomic Desk Mat</text>
  <text x="948" y="532" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">240 terjual • Rp 250rb</text>

