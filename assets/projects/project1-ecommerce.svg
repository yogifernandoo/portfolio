  <rect x="280" y="625" width="870" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="305" y="651" fill="#10b981" font-family="system-ui, sans-serif" font-size="13">● System Status: All API endpoints responding normal (Latency 21ms) • Auto-sync aktif</text>
</svg>
