  <path d="M 320 540 Q 400 480, 460 500 T 560 410 T 660 440 T 740 370 T 820 380" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
  <path d="M 320 540 Q 400 480, 460 500 T 560 410 T 660 440 T 740 370 T 820 380 L 820 570 L 320 570 Z" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="740" cy="370" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
