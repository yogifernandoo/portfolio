  <rect x="0" y="0" width="1200" height="50" rx="18" fill="#0f172a"/>
  <rect x="0" y="32" width="1200" height="18" fill="#0f172a"/>
  <circle cx="28" cy="25" r="7" fill="#ef4444"/>
  <circle cx="48" cy="25" r="7" fill="#f59e0b"/>
  <circle cx="68" cy="25" r="7" fill="#10b981"/>

